<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-OS | Hub</title>
    <style>
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 200px 200px 400px;
            gap: 20px;
            padding: 40px;
            background: #0f0f0f;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .tile { 
            background: #1a1a1a; 
            border-radius: 24px; 
            border: 1px solid #333; 
            transition: 0.3s; 
            color: white; 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }
        .tile:focus { 
            border-color: #007aff; 
            transform: scale(1.05); 
            outline: none; 
            box-shadow: 0 0 25px rgba(0,122,255,0.4); 
        }

        /* Layout Positioning */
        .greeting { grid-column: span 2; flex-direction: row; justify-content: space-between; padding: 0 30px; }
        .calendar { grid-column: span 1; grid-row: span 2; }
        .footer-wide { grid-column: span 2; grid-row: span 1; }
        
        .user-info { display: flex; align-items: center; }
        .switch-btn { 
            background: rgba(255,255,255,0.1); 
            border: none; color: #888; 
            padding: 8px 15px; border-radius: 10px; 
            cursor: pointer; font-size: 0.8rem;
        }
        .switch-btn:hover { background: #ff3b30; color: white; }
    </style>
</head>
<body>

<div class="bento-grid">
    <!-- Greeting Section -->
    <div class="tile greeting">
        <div class="user-info">
            <img id="user-img" style="width:80px; height:80px; border-radius:50%; margin-right:20px; object-fit: cover; background: #333;">
            <div>
                <h1 id="user-name" style="margin:0; font-size: 1.5rem;">Welcome</h1>
                <p id="live-date" style="margin: 5px 0 0 0; color: #888;"></p>
            </div>
        </div>
        <button class="switch-btn" onclick="window.location.href='Login.html'">Switch User</button>
    </div>

    <!-- Apps -->
    <a href="https://onedrive.live.com" class="tile" tabindex="1">OneDrive</a>
    <a href="https://vidsrc.me" class="tile" tabindex="2">Vidbox</a>

    <!-- Football Score Widget (Your interest in association football tactics) -->
    <div class="tile footer-wide">
        <iframe src="https://www.livescore.com/en/football/" style="width:100%; height:100%; border:none;"></iframe>
    </div>
    
    <!-- News Widget -->
    <div class="tile footer-wide">
        <iframe src="https://rss.app/embed/v1/wall/YOUR_KEY" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <!-- Calendar -->
    <div class="tile calendar">
        <iframe src="https://calendar.google.com/calendar/embed?src=en.dutch%23holiday%40group.v.calendar.google.com&ctz=Europe%2FAmsterdam" style="width:100%; height:100%; border:none; filter: invert(0.9) hue-rotate(180deg);"></iframe>
    </div>
</div>

<script>
    window.onload = function() {
        // Pull data from the 'active' keys used in Login.html
        const activeName = localStorage.getItem('active_user');
        const activePic = localStorage.getItem('active_pic');

        if (activeName) {
            document.getElementById('user-name').innerText = `Welcome, ${activeName}`;
        } else {
            // Redirect back to login if someone tries to open the hub without a session
            window.location.href = "Login.html";
        }

        if (activePic) {
            document.getElementById('user-img').src = activePic;
        }

        // Set the live date
        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        document.getElementById('live-date').innerText = new Date().toLocaleDateString('en-NL', options);
    }
</script>

</body>
</html>
