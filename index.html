<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-OS | Universal Family Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --accent: #007aff;
            --bg: #000;
            --card-bg: rgba(28, 28, 30, 0.9);
            --border: #222;
            --radius: 24px;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg); color: white;
            font-family: -apple-system, sans-serif;
            height: 100vh; overflow: hidden;
        }

        /* The Grid Logic */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: 180px;
            gap: 20px;
            padding: 25px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        .tile {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
            transition: transform 0.2s ease;
        }

        /* Fixed Alignment for Clock/Profile */
        .profile-container {
            grid-column: span 8;
            display: flex;
            align-items: center;
            justify-content: space-between; /* Keeps switch and clock balanced */
            padding: 0 40px;
        }

        .clock-stack {
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers clock text */
            flex-grow: 1;
        }

        #clock { font-size: 3.5rem; font-weight: 800; margin: 0; }
        #live-date { color: #666; font-size: 1rem; }

        /* Menu Overlay */
        #settings-menu {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: #1c1c1e; border: 1px solid #333;
            padding: 30px; border-radius: 24px; z-index: 2000;
            display: none; width: 350px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        #settings-menu.active { display: block; transform: translate(-50%, -50%) scale(1); }

        .menu-btn {
            width: 100%; padding: 12px; margin: 8px 0;
            background: #2c2c2e; border: none; color: white;
            border-radius: 12px; cursor: pointer; text-align: left;
        }
        .menu-btn:hover { background: var(--accent); }

        /* FAB Button */
        .fab {
            position: fixed; bottom: 30px; right: 30px;
            width: 50px; height: 50px; border-radius: 50%;
            background: var(--accent); border: none; color: white;
            cursor: pointer; z-index: 1000; font-size: 1.2rem;
        }

        /* Wiggle */
        @keyframes wiggle { 
            0% { transform: rotate(-0.5deg); } 
            50% { transform: rotate(0.5deg); } 
            100% { transform: rotate(-0.5deg); } 
        }
        .editing .tile { animation: wiggle 0.3s infinite; }

        #family-notes {
            flex: 1; background: transparent; border: none;
            color: #ccc; padding: 20px; font-family: inherit;
            font-size: 1rem; resize: none; outline: none;
        }

        .widget-header { padding: 15px 20px 0; color: var(--accent); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }

        iframe { filter: invert(0.9) hue-rotate(180deg) brightness(0.8); width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<button class="fab" onclick="toggleMenu()">⚙️</button>

<div id="settings-menu">
    <h3 style="margin-top:0">Hub Settings</h3>
    <button class="menu-btn" onclick="toggleEditMode()">✏️ Edit Tile Positions</button>
    <button class="menu-btn" onclick="resetLayout()">🔄 Reset to Default</button>
    <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
    <p style="font-size:0.8rem; color:#666">Add New Widget:</p>
    <button class="menu-btn" onclick="addCustomTile('iframe')">🌐 Add Website (Iframe)</button>
    <button class="menu-btn" onclick="addCustomTile('text')">📝 Add Text Box</button>
    <button class="menu-btn" onclick="addCustomTile('image')">🖼️ Add Picture</button>
    <button class="menu-btn" style="background:#444" onclick="toggleMenu()">Close</button>
</div>

<div class="bento-grid" id="main-grid">
    <div class="tile profile-container" data-id="profile">
        <img id="user-img" src="" style="width:70px; height:70px; border-radius:50%; border:2px solid var(--accent); object-fit:cover;">
        <div class="clock-stack">
            <h1 id="clock">00:00</h1>
            <div id="live-date">...</div>
        </div>
        <button onclick="location.href='https://khristiankorir0123-gif.github.io/login-screen/'" style="background:rgba(255,255,255,0.05); color:white; border:1px solid #333; padding:10px 18px; border-radius:12px; cursor:pointer;">Switch</button>
    </div>

    <div class="tile" style="grid-column:span 2" data-id="app1"><a href="https://onedrive.live.com" style="color:white; text-decoration:none; display:flex; align-items:center; justify-content:center; height:100%;">OneDrive</a></div>
    <div class="tile" style="grid-column:span 2" data-id="app2"><a href="https://vidbox.de" style="color:white; text-decoration:none; display:flex; align-items:center; justify-content:center; height:100%;">Vidbox</a></div>

    <div class="tile" style="grid-column:span 4; grid-row:span 2" data-id="scores">
        <div class="widget-header">Live Scores</div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; color:#444;">No live matches.</div>
    </div>

    <div class="tile" style="grid-column:span 4; grid-row:span 2" data-id="calendar">
        <div class="widget-header">Calendar</div>
        <iframe src="https://calendar.google.com/calendar/embed?src=en.dutch%23holiday%40group.v.calendar.google.com&ctz=Europe%2FAmsterdam"></iframe>
    </div>

    <div class="tile" style="grid-column:span 4; grid-row:span 2" data-id="notes">
        <div class="widget-header">Universal Notes</div>
        <textarea id="family-notes" placeholder="Type here to sync..."></textarea>
    </div>
</div>

<script>
    const PANTRY_ID = "94635661-89e8-466d-965a-0761e3893322";
    const API_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/family_notes`;
    
    // --- Cloud Sync ---
    const notesArea = document.getElementById('family-notes');
    async function syncNotes(save = false) {
        try {
            if(save) {
                await fetch(API_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: notesArea.value}) });
            } else {
                const res = await fetch(API_URL);
                const data = await res.json();
                if(document.activeElement !== notesArea) notesArea.value = data.text || "";
            }
        } catch(e) { console.warn("Sync Issue"); }
    }

    notesArea.addEventListener('input', () => syncNotes(true));
    setInterval(() => syncNotes(false), 5000);

    // --- Menu & Custom Tiles ---
    function toggleMenu() { document.getElementById('settings-menu').classList.toggle('active'); }

    function addCustomTile(type) {
        const grid = document.getElementById('main-grid');
        const newTile = document.createElement('div');
        newTile.className = "tile";
        newTile.style.gridColumn = "span 4";
        newTile.style.gridRow = "span 2";
        newTile.setAttribute('data-id', 'custom-' + Date.now());

        if(type === 'iframe') {
            const url = prompt("Enter Website URL:", "https://bing.com");
            newTile.innerHTML = `<div class="widget-header">Browser</div><iframe src="${url}"></iframe>`;
        } else if(type === 'text') {
            newTile.innerHTML = `<div class="widget-header">Note</div><textarea style="flex:1; background:transparent; border:none; color:white; padding:15px;"></textarea>`;
        } else if(type === 'image') {
            const img = prompt("Enter Image URL:");
            newTile.innerHTML = `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">`;
        }
        grid.appendChild(newTile);
        toggleMenu();
    }

    // --- Layout Control ---
    let sortable;
    function toggleEditMode() {
        const grid = document.getElementById('main-grid');
        if(grid.classList.contains('editing')) {
            grid.classList.remove('editing');
            const order = sortable.toArray();
            localStorage.setItem('hub-layout', JSON.stringify(order));
            sortable.destroy();
            toggleMenu();
        } else {
            grid.classList.add('editing');
            sortable = Sortable.create(grid, { animation: 250 });
            toggleMenu();
        }
    }

    function resetLayout() {
        localStorage.removeItem('hub-layout');
        location.reload();
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('live-date').textContent = now.toLocaleDateString('en-NL', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    window.onload = () => {
        updateClock(); setInterval(updateClock, 1000);
        syncNotes();
        document.getElementById('user-img').src = localStorage.getItem('active_pic') || '';

        const savedOrder = JSON.parse(localStorage.getItem('hub-layout'));
        if (savedOrder) {
            const grid = document.getElementById('main-grid');
            const tiles = Array.from(grid.children);
            savedOrder.forEach(id => {
                const tile = tiles.find(t => t.getAttribute('data-id') === id);
                if (tile) grid.appendChild(tile);
            });
        }
    };
</script>
</body>
</html>
