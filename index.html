<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-OS | Hub</title>
    <style>
        :root { --accent: #007aff; --glass: rgba(255, 255, 255, 0.05); }
        
        body { 
            background: #000; 
            color: white; 
            font-family: -apple-system, sans-serif; 
            margin: 0; 
            height: 100vh;
            overflow: hidden;
        }

        /* 6-Section Grid Layout */
        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr; /* Side, Center, Side */
            grid-template-rows: 160px 1fr; /* Top row for Profile/Apps, Bottom for Data */
            gap: 20px;
            padding: 25px;
            height: 100vh;
            box-sizing: border-box;
        }

        .tile { 
            background: #111; 
            border-radius: 24px; 
            border: 1px solid #222; 
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Row Specials */
        .profile-section { display: flex; align-items: center; padding: 0 30px; justify-content: space-between; }
        .apps-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: none; border: none; }
        
        /* App Buttons */
        .app-btn {
            background: #111;
            border: 1px solid #222;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }
        .app-btn:hover { border-color: var(--accent); transform: translateY(-2px); }

        /* Widgets */
        .widget-header { 
            padding: 20px 20px 10px; 
            color: var(--accent); 
            font-weight: bold; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .scroll-area { flex: 1; overflow-y: auto; padding: 0 20px 20px; }
        
        /* Time Display */
        #clock { font-size: 2.5rem; font-weight: 700; margin: 10px 0; }
        #live-date { color: #888; font-size: 1rem; }

        .edit-btn {
            position: absolute; top: 15px; right: 15px;
            background: rgba(255,255,255,0.1); border: none; color: #666;
            padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.7rem;
        }
        .edit-btn:hover { color: white; background: var(--accent); }

        iframe { width: 100%; height: 100%; border: none; border-radius: 15px; }

        /* Proxy fix for Feed Errors */
        .error-msg { color: #444; font-size: 0.9rem; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

<div class="bento-grid">
    <!-- 1. Profile & Time -->
    <div class="tile profile-section">
        <div style="display: flex; align-items: center;">
            <img id="user-img" src="" style="width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--accent); margin-right: 20px;">
            <div>
                <div id="clock">00:00</div>
                <div id="live-date">Loading date...</div>
            </div>
        </div>
        <button class="switch-btn" onclick="location.href='https://khristiankorir0123-gif.github.io/login-screen/'" style="background:var(--glass); border:1px solid #333; color:white; padding:8px 15px; border-radius:12px; cursor:pointer;">Switch</button>
    </div>

    <!-- 2. Apps Section (Top Center) -->
    <div class="tile apps-section">
        <a href="https://onedrive.live.com" class="app-btn">☁️ OneDrive</a>
        <a href="https://vidbox.de" class="app-btn">🎬 Vidbox</a>
    </div>

    <!-- 3. Edit/Settings (Top Right) -->
    <div class="tile" style="justify-content: center; align-items: center; background: var(--glass);">
        <button class="app-btn" style="width: 80%; height: 50px;" onclick="alert('Edit Mode Active')">⚙️ Edit Tiles</button>
    </div>

    <!-- 4. Score Feed (Left Bottom) -->
    <div class="tile">
        <div class="widget-header">Live Scores <span style="color:#444">In-Play</span></div>
        <div class="scroll-area" id="match-list">
            <div class="error-msg">Checking for live matches...</div>
        </div>
    </div>

    <!-- 5. Large Calendar (Center Bottom) -->
    <div class="tile" style="padding: 10px;">
        <iframe src="https://calendar.google.com/calendar/embed?src=en.dutch%23holiday%40group.v.calendar.google.com&ctz=Europe%2FAmsterdam" style="filter: invert(0.9) hue-rotate(180deg) brightness(0.8);"></iframe>
    </div>

    <!-- 6. Large News Feed (Right Bottom) -->
    <div class="tile">
        <div class="widget-header">Latest News</div>
        <div class="scroll-area" id="news-list">
            <div class="error-msg">Fetching RSS feed...</div>
        </div>
    </div>
</div>

<script>
    // --- TECH TIP: FIXING THE FEED ERRORS ---
    // Since browsers block direct requests, we use a 'CORS Proxy' for development.
    const PROXY = "https://cors-anywhere.herokuapp.com/"; 
    const SPORTMONKS_TOKEN = 'YOUR_API_TOKEN_HERE';
    const NEWS_URL = "https://rss.app/feeds/tgVNLlUheA584JKg.csv";

    function updateTime() {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('live-date').textContent = now.toLocaleDateString('en-NL', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    async function fetchScores() {
        const container = document.getElementById('match-list');
        // If this fails, it's 100% a CORS issue or an expired API Token
        try {
            const res = await fetch(`${PROXY}https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${SPORTMONKS_TOKEN}`);
            const data = await res.json();
            // Map data here...
        } catch (e) {
            container.innerHTML = `<div class="error-msg">Scores unavailable.<br><small>Tip: Enable CORS in browser settings</small></div>`;
        }
    }

    async function fetchNews() {
        const container = document.getElementById('news-list');
        try {
            const res = await fetch(`${PROXY}${NEWS_URL}`);
            const text = await res.text();
            const lines = text.split('\n').slice(1, 15); // Show more lines to fill space
            container.innerHTML = lines.map(l => `<div style="padding:15px 0; border-bottom:1px solid #222; color:#bbb; font-size:0.9rem;">${l.split(',')[0]}</div>`).join('');
        } catch (e) {
            container.innerHTML = `<div class="error-msg">News feed blocked by CORS.</div>`;
        }
    }

    window.onload = () => {
        document.getElementById('user-img').src = localStorage.getItem('active_pic') || '';
        updateTime();
        setInterval(updateTime, 1000);
        fetchScores();
        fetchNews();
    };
</script>
</body>
</html>
