<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-OS | Hub</title>
    <style>
        :root { --accent: #007aff; --glass: rgba(255, 255, 255, 0.05); }
        
        body { 
            background: #000; 
            color: white; 
            font-family: -apple-system, sans-serif; 
            margin: 0; 
            overflow-x: hidden;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 180px 220px 450px;
            gap: 20px;
            padding: 40px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .tile { 
            background: #111; 
            border-radius: 28px; 
            border: 1px solid #222; 
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
            color: white; 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }

        .tile:hover, .tile:focus { 
            border-color: var(--accent); 
            transform: scale(1.03); 
            outline: none; 
            box-shadow: 0 0 30px rgba(0,122,255,0.2);
            background: #161616;
        }

        .greeting { grid-column: span 2; flex-direction: row; justify-content: space-between; padding: 0 40px; background: var(--glass); backdrop-filter: blur(10px); }
        .calendar { grid-column: span 1; grid-row: span 2; }
        .footer-wide { grid-column: span 2; grid-row: span 1; align-items: flex-start; justify-content: flex-start; padding: 25px; }
        
        .user-info { display: flex; align-items: center; }
        #user-img { width: 90px; height: 90px; border-radius: 50%; margin-right: 25px; object-fit: cover; border: 2px solid var(--accent); background: #222; }
        
        .switch-btn { 
            background: rgba(255,255,255,0.1); 
            border: none; color: #aaa; 
            padding: 10px 20px; border-radius: 12px; 
            cursor: pointer; font-size: 0.9rem; font-weight: 500;
        }

        .widget-title { color: var(--accent); font-weight: bold; margin-bottom: 15px; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; }
        #match-list, #news-list { width: 100%; overflow-y: auto; }
        .app-label { margin-top: 10px; font-weight: 500; font-size: 1.1rem; }
        
        #news-list::-webkit-scrollbar { width: 4px; }
        #news-list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="bento-grid">
    <div class="tile greeting">
        <div class="user-info">
            <img id="user-img" src="" alt="Profile">
            <div>
                <h1 id="user-name" style="margin:0; font-size: 1.8rem; font-weight: 600;">Welcome</h1>
                <p id="live-date" style="margin: 5px 0 0 0; color: #888; font-size: 1.1rem;"></p>
            </div>
        </div>
        <button class="switch-btn" onclick="switchUser()">Switch Profile</button>
    </div>

    <a href="https://onedrive.live.com" class="tile" tabindex="1">
        <span style="font-size: 2rem;">☁️</span><span class="app-label">OneDrive</span>
    </a>
    <a href="https://vidbox.de" class="tile" tabindex="2">
        <span style="font-size: 2rem;">🎬</span><span class="app-label">Vidbox</span>
    </a>

    <div class="tile footer-wide">
        <div class="widget-title">Live Scores</div>
        <div id="match-list">Fetching live matches...</div>
    </div>
    
    <div class="tile footer-wide">
        <div class="widget-title">Latest Headlines</div>
        <div id="news-list">Fetching news feed...</div>
    </div>

    <div class="tile calendar">
        <iframe src="https://calendar.google.com/calendar/embed?src=en.dutch%23holiday%40group.v.calendar.google.com&ctz=Europe%2FAmsterdam" style="filter: invert(0.92) hue-rotate(180deg);"></iframe>
    </div>
</div>

<script>
    const SPORTMONKS_TOKEN = 'PASTE_YOUR_API_TOKEN_HERE';
    const NEWS_CSV_URL = "https://rss.app/feeds/tgVNLlUheA584JKg.csv";
    const LOGIN_PATH = "https://khristiankorir0123-gif.github.io/login-screen/";

    async function fetchScores() {
        const url = `https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${SPORTMONKS_TOKEN}&include=participants;scores`;
        try {
            const res = await fetch(url);
            const json = await res.json();
            const matches = json.data || [];
            const container = document.getElementById('match-list');
            if (matches.length === 0) {
                container.innerHTML = "<div style='color:#666;'>No matches currently inplay.</div>";
                return;
            }
            container.innerHTML = matches.slice(0, 4).map(match => {
                const home = match.participants.find(p => p.meta.location === 'home');
                const away = match.participants.find(p => p.meta.location === 'away');
                const hScore = match.scores.find(s => s.description === 'CURRENT' && s.participant_id === home.id)?.score.goals || 0;
                const aScore = match.scores.find(s => s.description === 'CURRENT' && s.participant_id === away.id)?.score.goals || 0;
                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:rgba(255,255,255,0.02); border-radius:15px; margin-bottom:10px; border:1px solid #222;">
                        <span style="flex:1; text-align:right; font-size:0.9rem;">${home.name}</span>
                        <span style="background:var(--accent); padding:4px 12px; border-radius:8px; margin:0 15px; font-weight:bold; min-width:35px; text-align:center;">${hScore} - ${aScore}</span>
                        <span style="flex:1; text-align:left; font-size:0.9rem;">${away.name}</span>
                    </div>`;
            }).join('');
        } catch (e) { document.getElementById('match-list').innerHTML = "Score feed error."; }
    }

    async function fetchNews() {
        try {
            const res = await fetch(NEWS_CSV_URL);
            const data = await res.text();
            const rows = data.split('\n').slice(1);
            const container = document.getElementById('news-list');
            container.innerHTML = rows.map(row => {
                const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                if (!cols || cols.length < 2) return '';
                const title = cols[0].replace(/"/g, '');
                const link = cols[1].replace(/"/g, '');
                return `<a href="${link}" target="_blank" style="display:block; color:#aaa; text-decoration:none; padding:12px 0; border-bottom:1px solid #222; font-size:0.95rem; transition:0.2s;">• ${title}</a>`;
            }).join('');
        } catch (e) { document.getElementById('news-list').innerHTML = "News feed error."; }
    }

    function switchUser() {
        window.location.href = LOGIN_PATH;
    }

    window.onload = function() {
        const name = localStorage.getItem('active_user');
        const pic = localStorage.getItem('active_pic');
        if (!name) return switchUser();

        document.getElementById('user-name').innerText = `Welcome, ${name}`;
        if (pic) document.getElementById('user-img').src = pic;

        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        document.getElementById('live-date').innerText = new Date().toLocaleDateString('en-NL', options);

        fetchScores();
        fetchNews();
        setInterval(fetchScores, 60000);
    }
</script>
</body>
</html>
