<style>
    .bento-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: 200px 200px 400px;
        gap: 20px;
        padding: 40px;
        background: #0f0f0f;
    }
    .tile { background: #1a1a1a; border-radius: 24px; border: 1px solid #333; transition: 0.3s; color: white; text-decoration: none; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .tile:focus { border-color: #007aff; transform: scale(1.05); outline: none; box-shadow: 0 0 25px rgba(0,122,255,0.4); }

    /* Layout Positioning based on image_8fbfdd.png */
    .greeting { grid-column: span 2; flex-direction: row; justify-content: flex-start; padding: 20px; }
    .calendar { grid-column: span 1; grid-row: span 2; }
    .footer-wide { grid-column: span 2; grid-row: span 1; overflow: hidden; }
</style>

<div class="bento-grid">
    <!-- Greeting (image_8fbfdd.png top center) -->
    <div class="tile greeting">
        <img id="user-img" style="width:80px; height:80px; border-radius:50%; margin-right:20px;">
        <div>
            <h1 id="user-name">Welcome</h1>
            <p id="live-date"></p>
        </div>
    </div>

    <!-- Apps (image_8fbfdd.png top left) -->
    <a href="https://onedrive.live.com" class="tile" tabindex="1">OneDrive</a>
    <a href="https://vidsrc.me" class="tile" tabindex="2">Vidbox</a>

    <!-- Big Tiles (image_8fbfdd.png bottom) -->
    <div class="tile footer-wide">
        <!-- Football Score Widget -->
        <iframe src="https://www.livescore.com/en/football/" style="width:100%; height:100%; border:none;"></iframe>
    </div>
    
    <div class="tile footer-wide">
        <!-- News Widget -->
        <iframe src="https://rss.app/embed/v1/wall/YOUR_KEY" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <div class="tile calendar">
        <iframe src="https://calendar.google.com/calendar/embed?src=en.dutch%23holiday%40group.v.calendar.google.com&ctz=Europe%2FAmsterdam" style="width:100%; height:100%; border:none; filter: invert(0.9);"></iframe>
    </div>
</div>

<script>
    document.getElementById('user-name').innerText = "Welcome, " + localStorage.getItem('hub_name');
    document.getElementById('user-img').src = localStorage.getItem('hub_pic');
    document.getElementById('live-date').innerText = new Date().toLocaleDateString();
</script>
