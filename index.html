<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-OS | Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root { 
            --accent: #007aff; 
            --card-bg: #111;
            --border: #222;
            --radius: 24px;
        }
        
        body { 
            background: #000; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        /* 12-Column Grid for perfect math */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .tile { 
            background: var(--card-bg); 
            border-radius: var(--radius); 
            border: 1px solid var(--border); 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 160px;
        }

        /* TOP ROW: 4 Sections (12 / 4 = 3 columns each) */
        .col-4-grid { grid-column: span 3; }
        .profile-section { grid-column: span 6; flex-direction: row; align-items: center; padding: 0 25px; justify-content: space-between; }

        /* BOTTOM ROW: 3 Sections (12 / 3 = 4 columns each) */
        .col-3-grid { grid-column: span 4; height: 450px; }

        /* Widget Details */
        .widget-header { 
            padding: 20px 20px 10px; 
            color: var(--accent); 
            font-weight: 700; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        #clock { font-size: 2.8rem; font-weight: 700; margin: 0; }
        #live-date { color: #666; font-size: 0.9rem; }

        .app-btn {
            background: #181818; border: 1px solid #282828; border-radius: 18px;
            color: white; text-decoration: none; display: flex; align-items: center;
            justify-content: center; height: 100%; transition: 0.2s; font-weight: 500;
        }
        .app-btn:hover { border-color: var(--accent); background: #202020; }

        .cal-frame { 
            filter: invert(0.9) hue-rotate(180deg) brightness(0.8); 
            width: 100%; height: 100%; border: none; flex-grow: 1;
        }

        /* News Widget Fix */
        .rss-container { flex: 1; background: transparent !important; }
        rssapp-carousel { background: transparent !important; }

        /* Empty State */
        .empty-text { flex: 1; display: flex; align-items: center; justify-content: center; color: #333; font-size: 0.9rem; }

        /* Mobile Fix */
        @media (max-width: 900px) {
            .bento-grid { grid-template-columns: 1fr; }
            .col-4-grid, .col-3-grid, .profile-section { grid-column: span 1; height: auto; min-height: 180px; }
            .col-3-grid { height: 400px; }
        }
    </style>
</head>
<body>

<div class="bento-grid" id="main-grid">
    <!-- TOP ROW (Total 12 units) -->
    <div class="tile profile-section">
        <div style="display: flex; align-items: center; gap: 20px;">
            <img id="user-img" src="" style="width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover;">
            <div>
                <h1 id="clock">00:00</h1>
                <p id="live-date">...</p>
            </div>
        </div>
        <button onclick="location.href='https://khristiankorir0123-gif.github.io/login-screen/'" style="background:rgba(255,255,255,0.05); border:1px solid #333; color:white; padding:10px 18px; border-radius:12px; cursor:pointer;">Switch</button>
    </div>
    
    <div class="tile col-4-grid" style="padding:15px;"><a href="https://onedrive.live.com" class="app-btn">OneDrive</a></div>
    <div class="tile col-4-grid" style="padding:15px;"><a href="https://vidbox.de" class="app-btn">Vidbox</a></div>

    <!-- BOTTOM ROW (Total 12 units) -->
    <div class="tile col-3-grid">
        <div class="widget-header">Live Scores</div>
        <div class="empty-text">No active matches</div>
    </div>

    <div class="tile col-3-grid">
        <div class="widget-header">Calendar</div>
        <iframe src="https://calendar.google.com/calendar/embed?src=en.dutch%23holiday%40group.v.calendar.google.com&ctz=Europe%2FAmsterdam" class="cal-frame"></iframe>
    </div>

    <div class="tile col-3-grid" style="background: transparent;">
        <div class="widget-header">Headlines</div>
        <div class="rss-container">
            <rssapp-carousel id="tgVNLlUheA584JKg"></rssapp-carousel>
            <script src="https://widget.rss.app/v1/carousel.js" type="text/javascript" async></script>
        </div>
    </div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('live-date').textContent = now.toLocaleDateString('en-NL', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    window.onload = () => {
        document.getElementById('user-img').src = localStorage.getItem('active_pic') || '';
        updateClock();
        setInterval(updateClock, 1000);
    };
</script>
</body>
</html>
