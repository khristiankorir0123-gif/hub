<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-OS | Family Hub Elite</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        /* --- THE DESIGN SYSTEM ---
           Inspired by macOS Ventura and iOS 17.
           Optimized for the M3 MacBook Air Liquid Retina Display.
        */
        :root {
            --accent: #007aff;
            --accent-glow: rgba(0, 122, 255, 0.5);
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --radius-large: 32px;
            --radius-small: 16px;
            --glass-blur: blur(25px) saturate(180%);
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- CORE RESET --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* --- DYNAMIC BACKGROUND --- */
        .wallpaper-engine {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1c1c1e 0%, #000000 100%);
            z-index: -1;
        }

        /* --- THE BENTO GRID --- */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: 180px repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            padding: 35px;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            margin: 0 auto;
            align-content: start;
        }

        .tile {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-large);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: transform 0.4s var(--transition), box-shadow 0.4s var(--transition), border 0.4s var(--transition);
        }

        /* --- PROFILE & CLOCK (BALANCED ALIGNMENT) --- */
        .profile-hero {
            grid-column: span 8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 45px;
        }

        .avatar-wrap {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            object-fit: cover;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .time-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }

        #clock-digital {
            font-size: 4.2rem;
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 1;
        }

        #date-display {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 4px;
        }

        .switch-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: white;
            padding: 14px 24px;
            border-radius: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
        }
        .switch-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }

        /* --- EDITING UX --- */
        @keyframes wiggle {
            0% { transform: rotate(-0.7deg); }
            50% { transform: rotate(0.7deg); }
            100% { transform: rotate(-0.7deg); }
        }

        .mode-editing .tile {
            animation: wiggle 0.3s infinite ease-in-out;
            cursor: grab;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .delete-trigger {
            position: absolute;
            top: 12px; left: 12px;
            width: 28px; height: 28px;
            background: #ff3b30;
            border-radius: 50%;
            border: 2px solid white;
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .mode-editing .delete-trigger { display: flex; }

        /* --- WIDGET HEADERS --- */
        .widget-label {
            padding: 24px 30px 10px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sync-blob {
            width: 8px; height: 8px;
            background: #34c759;
            border-radius: 50%;
            box-shadow: 0 0 10px #34c759;
            opacity: 0;
            transition: 0.3s;
        }

        /* --- CONTENT AREAS --- */
        iframe {
            width: 100%; height: 100%;
            border: none;
            filter: invert(0.92) hue-rotate(180deg) brightness(0.95);
            pointer-events: none; /* Block interactions in grid view */
        }
        .mode-normal iframe { pointer-events: auto; }

        #cloud-notes-area {
            flex: 1;
            background: transparent;
            border: none;
            color: #efeff4;
            padding: 5px 30px 30px;
            font-family: inherit;
            font-size: 1.1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        /* --- SETTINGS MENU --- */
        #master-settings {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 380px;
            background: #1c1c1e;
            border: 1px solid #333;
            border-radius: 32px;
            padding: 35px;
            z-index: 3000;
            display: none;
            opacity: 0;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        }
        #master-settings.visible { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }

        .option-row {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background: #2c2c2e;
            border: none;
            border-radius: 16px;
            color: white;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .option-row:hover { background: var(--accent); }

        /* --- FAB --- */
        .action-fab {
            position: fixed;
            bottom: 40px; right: 40px;
            width: 60px; height: 60px;
            background: var(--accent-gradient, var(--accent));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            z-index: 2500;
            box-shadow: 0 10px 25px rgba(0,122,255,0.4);
            border: none; color: white; font-size: 1.5rem;
            transition: 0.3s;
        }
        .action-fab:hover { transform: scale(1.1) rotate(15deg); }

        /* --- RESPONSIVE --- */
        @media (max-width: 1100px) {
            body { overflow-y: auto; }
            .bento-grid { display: flex; flex-direction: column; height: auto; }
            .tile { min-height: 300px; }
            .profile-hero { flex-direction: column; padding: 40px; gap: 25px; }
            .time-center { position: static; transform: none; }
        }
    </style>
</head>
<body class="mode-normal">

    <div class="wallpaper-engine"></div>

    <button class="action-fab" onclick="ui.toggleMenu()">⚙️</button>

    <div id="master-settings">
        <h2 style="margin-bottom: 25px; font-weight: 800;">Control Center</h2>
        <button class="option-row" onclick="layout.initEdit()">✏️ Customize Layout</button>
        <button class="option-row" onclick="layout.reset()">🔄 Factory Reset Grid</button>
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        <p style="font-size: 0.8rem; color: #666; margin-bottom: 10px;">ADD NEW WIDGET</p>
        <button class="option-row" onclick="widgets.create('iframe')">🌐 Website Frame</button>
        <button class="option-row" onclick="widgets.create('text')">📝 Shared Text Block</button>
        <button class="option-row" onclick="widgets.create('image')">🖼️ Visual Gallery</button>
        <button class="option-row" style="background: #3a3a3c; margin-top: 15px;" onclick="ui.toggleMenu()">Done</button>
    </div>

    <div class="bento-grid" id="master-grid">
        
        <div class="tile profile-hero" data-id="tile-profile">
            <div class="delete-trigger" onclick="widgets.remove(this)">−</div>
            <div class="avatar-wrap">
                <img id="user-avatar" src="" alt="Avatar">
                <span id="greeting" style="font-size: 1.2rem; font-weight: 600;">Welcome back</span>
            </div>
            
            <div class="time-center">
                <div id="clock-digital">00:00</div>
                <div id="date-display">...</div>
            </div>

            <button class="switch-btn" onclick="location.href='https://khristiankorir0123-gif.github.io/login-screen/'">
                Switch Profile
            </button>
        </div>

        <div class="tile" style="grid-column: span 2;" data-id="tile-one-drive">
            <div class="delete-trigger" onclick="widgets.remove(this)">−</div>
            <a href="https://onedrive.live.com" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; text-decoration:none; color:white; font-weight:700; font-size:1.1rem;">OneDrive</a>
        </div>

        <div class="tile" style="grid-column: span 2;" data-id="tile-vidbox">
            <div class="delete-trigger" onclick="widgets.remove(this)">−</div>
            <a href="https://vidbox.de" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; text-decoration:none; color:white; font-weight:700; font-size:1.1rem;">Vidbox</a>
        </div>

        <div class="tile" style="grid-column: span 4; grid-row: span 2;" data-id="tile-calendar">
            <div class="delete-trigger" onclick="widgets.remove(this)">−</div>
            <div class="widget-label">Shared Calendar</div>
            <iframe src="https://calendar.google.com/calendar/embed?src=en.dutch%23holiday%40group.v.calendar.google.com&ctz=Europe%2FAmsterdam"></iframe>
        </div>

        <div class="tile" style="grid-column: span 4; grid-row: span 2;" data-id="tile-notes">
            <div class="delete-trigger" onclick="widgets.remove(this)">−</div>
            <div class="widget-label">Family Cloud Notes <div class="sync-blob" id="sync-dot"></div></div>
            <textarea id="cloud-notes-area" placeholder="Write a note to the family..."></textarea>
        </div>

        <div class="tile" style="grid-column: span 4; grid-row: span 2;" data-id="tile-scores">
            <div class="delete-trigger" onclick="widgets.remove(this)">−</div>
            <div class="widget-label">Football Scores</div>
            <div style="flex:1; display:flex; align-items:center; justify-content:center; color:#444; font-size:0.9rem;">
                Monitoring live match data...
            </div>
        </div>

    </div>

    <script>
        /* --- HUB ENGINE ---
           Handles Cloud Sync, Grid Layout, and UI States.
        */

        // 1. DATA CONFIG
        const CONFIG = {
            PANTRY_ID: "94635661-89e8-466d-965a-0761e3893322",
            BASKET: "family_notes_elite",
            SYNC_INTERVAL: 10000, // 10 seconds
            HOLD_THRESHOLD: 800   // 0.8s for jiggle mode
        };

        const ui = {
            toggleMenu: () => {
                const menu = document.getElementById('master-settings');
                menu.classList.toggle('visible');
            }
        };

        // 2. CLOUD SYNC ENGINE
        const cloud = {
            url: `https://getpantry.cloud/apiv1/pantry/${CONFIG.PANTRY_ID}/basket/${CONFIG.BASKET}`,
            area: document.getElementById('cloud-notes-area'),
            dot: document.getElementById('sync-dot'),

            pull: async () => {
                try {
                    const res = await fetch(cloud.url);
                    const data = await res.json();
                    if (document.activeElement !== cloud.area) {
                        cloud.area.value = data.content || "";
                        cloud.flashDot();
                    }
                } catch (e) { console.warn("Cloud offline"); }
            },

            push: async () => {
                cloud.dot.style.opacity = "1";
                cloud.dot.style.background = "#ff9500";
                try {
                    await fetch(cloud.url, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ content: cloud.area.value })
                    });
                    cloud.dot.style.background = "#34c759";
                    setTimeout(() => cloud.dot.style.opacity = "0", 2000);
                } catch (e) { cloud.dot.style.background = "#ff3b30"; }
            },

            flashDot: () => {
                cloud.dot.style.opacity = "1";
                setTimeout(() => cloud.dot.style.opacity = "0", 1000);
            }
        };

        // 3. LAYOUT & DRAG ENGINE
        const layout = {
            grid: document.getElementById('master-grid'),
            sortable: null,
            timer: null,

            initEdit: () => {
                document.body.className = "mode-editing";
                layout.sortable = Sortable.create(layout.grid, {
                    animation: 300,
                    easing: "cubic-bezier(0.4, 0, 0.2, 1)",
                    onEnd: layout.save
                });
                ui.toggleMenu();
            },

            exitEdit: () => {
                if (document.body.className !== "mode-editing") return;
                document.body.className = "mode-normal";
                if (layout.sortable) {
                    layout.save();
                    layout.sortable.destroy();
                }
            },

            save: () => {
                const order = Array.from(layout.grid.children).map(t => t.getAttribute('data-id'));
                localStorage.setItem('k-os-layout-v4', JSON.stringify(order));
            },

            restore: () => {
                const saved = JSON.parse(localStorage.getItem('k-os-layout-v4'));
                if (saved) {
                    const tiles = Array.from(layout.grid.children);
                    saved.forEach(id => {
                        const target = tiles.find(t => t.getAttribute('data-id') === id);
                        if (target) layout.grid.appendChild(target);
                    });
                }
            },

            reset: () => {
                localStorage.removeItem('k-os-layout-v4');
                location.reload();
            }
        };

        // 4. WIDGET CREATOR
        const widgets = {
            create: (type) => {
                const id = `custom-${Date.now()}`;
                const tile = document.createElement('div');
                tile.className = "tile";
                tile.style.gridColumn = "span 4";
                tile.style.gridRow = "span 2";
                tile.setAttribute('data-id', id);

                const del = `<div class="delete-trigger" onclick="widgets.remove(this)">−</div>`;

                if (type === 'iframe') {
                    const url = prompt("Enter URL:", "https://bing.com");
                    tile.innerHTML = `${del}<div class="widget-label">Web View</div><iframe src="${url}"></iframe>`;
                } else if (type === 'text') {
                    tile.innerHTML = `${del}<div class="widget-label">Personal Note</div><textarea style="flex:1; background:transparent; border:none; color:white; padding:20px; font-family:inherit; outline:none;"></textarea>`;
                } else if (type === 'image') {
                    const src = prompt("Image URL:");
                    tile.innerHTML = `${del}<img src="${src}" style="width:100%; height:100%; object-fit:cover;">`;
                }

                layout.grid.appendChild(tile);
                ui.toggleMenu();
            },
            remove: (btn) => {
                btn.closest('.tile').remove();
                layout.save();
            }
        };

        // 5. CLOCK & BOOT
        function boot() {
            // Update Time
            const tick = () => {
                const now = new Date();
                document.getElementById('clock-digital').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('date-display').textContent = now.toLocaleDateString('en-NL', { weekday: 'long', day: 'numeric', month: 'long' });
            };
            setInterval(tick, 1000); tick();

            // Load Profile
            const pic = localStorage.getItem('active_pic');
            if (pic) document.getElementById('user-avatar').src = pic;

            // Restore Grid
            layout.restore();

            // Start Sync
            cloud.pull();
            setInterval(cloud.pull, CONFIG.SYNC_INTERVAL);

            // Listeners
            cloud.area.addEventListener('input', () => {
                clearTimeout(cloud.timer);
                cloud.timer = setTimeout(cloud.push, 2000);
            });

            // Long Press Logic
            document.addEventListener('mousedown', (e) => {
                if (document.body.className === "mode-editing") return;
                layout.timer = setTimeout(layout.initEdit, CONFIG.HOLD_THRESHOLD);
            });
            document.addEventListener('mouseup', () => clearTimeout(layout.timer));

            // Background Click to Exit
            document.addEventListener('click', (e) => {
                if (e.target === layout.grid && document.body.className === "mode-editing") {
                    layout.exitEdit();
                }
            });
        }

        window.onload = boot;
    </script>
</body>
</html>
